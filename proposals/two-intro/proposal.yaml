version: 1

meta:
  platform_name: 乘用车悬架平台
  module: 两则装置提案
  short_name: 两则装置提案
  axle: 后悬架
  purpose: 两则可以分开检索的装置提案。每则只做两页介绍。
  date: "2026-11-06"
  audience: 底盘技术评审与专利工程师
  classification: 内部评审
  example: true
  deck: intro
  author: 底盘悬架
  scope_line: 后悬架 · 副车架 · 两种轴距
  file_stem: 两则悬架装置提案

titles:
  platform: 毛坯和车身安装点尽量一种
  contradictions: 两个矛盾各写一案
  overview: 两案互不依赖
  family: 可以分案，不能合成一条系统权利要求
  roadmap: 检索完成前不把接触垫块和移位板做进对外图纸
  decisions: 先定哪一案送检索
  appendix: 这些方向本次不写

notes:
  platform: 用户还没有给出实车基线。这两案只写悬架零件之间的关系，并标明是提案稿。

platform:
  scope: 乘用车后悬架。平台希望副车架毛坯和车身安装点尽量一种，同时覆盖两种轴距。
  baseline: 后五连杆，副车架，螺旋弹簧，缓冲块装在弹簧座一侧。轴距差如果出现，基线倾向于另做一套副车架，或者只把车身安装孔拉开、硬点相对关系跟着变。
  assumptions:
    - 这是提案稿，不是某一主机厂的实测项目，也没有试验数据。
    - 前悬、转向和制动接口本次不动。
    - 写法样例里的分路支架、车高安装块和斜孔衬套不在这两案里。
  frozen:
    - 内点硬点不随第二接触改动。
    - 副车架与车身的安装孔希望保持同一组。
  interfaces:
    - 副车架与车身安装点
    - 缓冲块与弹簧座
    - 控制臂内点衬套
    - 半轴与球笼
  variants:
    - name: 短轴距
      difference: 后悬硬点更靠前的一种纵向位置
    - name: 长轴距
      difference: 后悬硬点更靠后的一种纵向位置

contradictions:
  - id: C1
    left: 缓冲块走完后还要能承受冲击
    right: 内点衬套不能兼做撞击挡块
    clash: 轮跳到底后的传力没有第二条路径
    baseline_failure: 基线只有弹簧座上的缓冲块。缓冲块走完以后，控制臂没有被规定的下一接触，额外冲击会撬进内点衬套。
  - id: C2
    left: 两种轴距希望共用一个副车架毛坯
    right: 下内点相对弹簧座的位置和衬套工作角不想跟着轴距漂
    clash: 只拉开车身安装孔
    baseline_failure: 基线要覆盖第二种轴距时，要么新开一套毛坯，要么只改车身孔。只改车身孔时，内点和弹簧座的相对位置以及衬套工作角会一起变。

proposals:
  - id: P1
    name: 轮跳末端避开内点衬套
    claim_type: 装置
    one_liner: 缓冲块走完后，冲击进纵梁
    problem_title: 缓冲块压到底以后，力不要再撬内点衬套
    solution_title: 第二接触只在缓冲块走完后闭合
    embodiment_title: 接触可以直接落在纵梁上，也可以经摇臂换向
    effect_title: 满行程后再加载，只看纵梁和内点衬套
    patent_title: 要保护的是闭合时机和传力终点
    contradiction_ids: [C1]
    only_this: 只解决缓冲块走完行程之后的冲击往哪走。不解决衬套刚度，也不解决轴距共用。
    conditions:
      - 车轮压到缓冲块工作行程的末端
      - 末端之后还有额外的垂向或纵向冲击
      - 内点衬套不承担行程末端的撞击
    baseline_failure: 基线把限位交给弹簧座上的缓冲块。缓冲块压实后，控制臂没有一条被规定的下一接触，额外冲击会经控制臂撬进内点衬套。
    card:
      problem: 缓冲块走完后，下一接触没有被规定。
      feature: 第二接触在缓冲块之后闭合，力进入副车架纵梁。
      criterion: 满行程后再加载，内点衬套的力不再跟着涨。
    essential_features:
      - id: F1
        text: 第二接触在控制臂与副车架纵梁之间，不经过内点衬套。
      - id: F2
        text: 正常轮跳时接触副张开，缓冲块走完行程后才闭合。
      - id: F3
        text: 闭合后额外冲击进入纵梁，内点衬套不再承担这份冲击。
      - id: F4
        text: 垫块可更换，内点硬点和车身安装孔不随这份限位改动。
    preferred_features:
      - id: R1
        text: 接触面使用可换耐磨片，磨损后不加工纵梁本体。
    diagram:
      caption: 传力示意，不是几何图
      note: 第二接触在缓冲块走完后才闭合。闭合后的力进入纵梁，不经过内点衬套。
      paths:
        - name: 正常轮跳
          tone: stiff
          steps: [车轮, 缓冲块, 弹簧座]
        - name: 缓冲块走完
          tone: soft
          steps: [控制臂撞击面, 副车架垫块, 纵梁]
    embodiments:
      - name: 纵梁垫块
        structure: 副车架纵梁上有垫块，控制臂上有撞击面。两者的间隙大于缓冲块的工作变形。
        difference: 相对摇臂方案，接触直接发生在臂和纵梁之间，没有中间杠杆。
      - name: 换向摇臂
        structure: 臂与纵梁之间有一支摇臂。缓冲块走完后摇臂闭合，把力换成进入纵梁的方向。
        difference: 相对直接垫块，接触力经过摇臂，避免臂的斜向力抠进纵梁翼缘。
    figure:
      view: 侧视，标出缓冲块间隙和第二接触间隙。第二间隙大于缓冲块工作行程。
      parts: 控制臂、缓冲块、弹簧座、副车架纵梁、垫块或摇臂、内点衬套。
      invariant: 副车架与车身的安装孔，以及第二接触指向纵梁的方向。
      variant_delta: 车高变化时可以改缓冲块间隙，不改第二接触的承力零件。
      difference_vs_baseline: 基线在缓冲块压实后没有规定的下一接触。本案把下一接触定在副车架上，并让它晚于缓冲块闭合。
    effects:
      - feature_ids: [F1, F2, F3]
        feature_label: 晚于缓冲块的第二路径
        rank: 必要
        mechanism: 缓冲块先承担工作行程内的限位。行程走完后第二接触闭合，后续冲击改由纵梁承担。
        effect: 缓冲块压实以后的额外载荷进入副车架纵梁，不进入内点衬套。
        setup: 把车轮压到缓冲块压实，再加一份垂向载荷，同时测量纵梁和内点衬套的力。
        criterion: 第二接触闭合后，纵梁的力继续增加，内点衬套的力不再随这份载荷增加。限值待测。
        status: 待测
      - feature_ids: [F4]
        feature_label: 垫块可换
        rank: 必要
        mechanism: 磨损件是垫块，纵梁和车身安装孔保持原零件。
        effect: 两种车型可以共用副车架与车身的安装孔。
        setup: 对照两种车型的车身安装孔坐标和垫块零件号。
        criterion: 安装孔坐标不变。更换的是垫块，不是副车架与车身的连接。
        status: 待测
      - feature_ids: [R1]
        feature_label: 耐磨片
        rank: 优选
        mechanism: 耐磨片夹在接触面之间，用紧固件固定。
        effect: 磨损后只换耐磨片，不加工纵梁。
        setup: 拆装一次耐磨片，检查纵梁本体是否要再加工。
        criterion: 纵梁加工面保持原状，耐磨片可以单独更换。
        status: 待测
    risks:
      - 第二间隙如果小于缓冲块工作行程，正常轮跳就会撞垫块，冲击声会提前出现。
      - 垫块松脱后，冲击会重新撬进内点衬套。防松要写进垫块的固定结构。
      - 摇臂方案要核对侧倾时左右臂的闭合是否对称，避免单侧先撞。
    patent:
      retrieval_risk: 中
      retrieval_risk_reason: 只写多加一个缓冲块几乎没有区分度。要同时写明晚于原缓冲块闭合、力进入纵梁、内点衬套不承接这份冲击。
      independent_claim: >
        一种后悬架的轮跳限位结构，包括弹簧座上的缓冲块，以及控制臂与副车架纵梁之间的第二接触副，其特征在于，
        所述第二接触副在缓冲块走完工作行程之前保持张开，在缓冲块走完工作行程之后闭合；
        闭合后，来自车轮的额外冲击经控制臂进入副车架纵梁，不经下控制臂内点衬套传递。
      dependents:
        - 第二接触副为纵梁上的垫块与控制臂上的撞击面，二者间隙大于缓冲块的工作变形。
        - 第二接触副含一支摇臂，摇臂把接触力换成进入纵梁的方向。
        - 接触面设有可更换的耐磨片，纵梁本体不随耐磨片更换而再加工。
      compare_with:
        - 只有弹簧座缓冲块、压实后靠内点衬套硬挡的常见布置
        - 把缓冲块直接顶在控制臂内点支架上的布置
        - 只在行程末端用控制去限轮跳，结构上没有第二接触
      must_not_claim:
        - 不保护降低内点衬套载荷这一效果本身
        - 不保护某个缓冲块刚度或间隙毫米数
        - 不把轴距共用写成已被本案解决
      standalone: 只有一种轴距时，晚闭合的第二接触和进入纵梁的路径仍然成立。

  - id: P2
    name: 轴距共用的机加移位板
    claim_type: 装置
    one_liner: 内点和弹簧座一起沿纵向移
    problem_title: 两种轴距不要做成两套副车架毛坯
    solution_title: 移位板带走内点和弹簧座，相对位置不变
    embodiment_title: 可以是两种机加面，也可以是一块防转板
    effect_title: 同一组车身孔上核对相对位置和衬套角度
    patent_title: 要保护的是一起搬走，不是单独开长孔
    contradiction_ids: [C2]
    only_this: 只解决两种轴距共用毛坯时，内点与弹簧座的相对位置如何保持。不解决缓冲块之后的冲击路径。
    conditions:
      - 短轴距和长轴距共用副车架毛坯
      - 车身安装孔希望是同一组
      - 下内点相对弹簧座的位置需要保持
    baseline_failure: 基线覆盖第二种轴距时，新开毛坯能保住硬点关系，但铸造本体不能共用。只把车身安装孔沿纵向拉开，内点、弹簧座和衬套工作角会一起离开原来的相对位置。
    card:
      problem: 只拉车身孔时，内点和弹簧座的相对位置会漂。
      feature: 移位板把内点和弹簧座一起沿纵向带走，相对位置不变。
      criterion: 同一组车身孔上，两种轴距的相对位置和衬套角度保持一致。
    essential_features:
      - id: F1
        text: 副车架毛坯一种，与车身连接的安装孔是同一组。
      - id: F2
        text: 机加移位板同时定位下控制臂内点和弹簧下座。
      - id: F3
        text: 两种轴距上，内点与弹簧座的相对位置不变，板只沿车辆纵向移动。
      - id: F4
        text: 衬套轴线角度由移位板的加工面保证，不靠垫片厚度累加。
    preferred_features:
      - id: R1
        text: 移位板设防错结构，短轴距板和长轴距板不能互换。
    diagram:
      caption: 位移示意，不是几何图
      note: 毛坯和车身孔不动。移位板把下内点和弹簧下座作为一组沿纵向移动，组内相对位置不变。
      paths:
        - name: 毛坯不动
          tone: stiff
          steps: [铸造毛坯, 车身安装孔]
        - name: 轴距移位
          tone: soft
          steps: [机加移位板, 下内点, 弹簧下座]
    embodiments:
      - name: 两种机加面
        structure: 同一毛坯、同一组车身孔。两种轴距的下内点孔和弹簧座面一起沿纵向错开，两者相对位置相同。
        difference: 相对防转板方案，纵向位置由毛坯上的机加面完成，没有额外螺栓板。
      - name: 防转板
        structure: 毛坯只有一种加工状态。防转板用定位面固定衬套轴线角度，并同时定位下控制臂内点和弹簧下座。
        difference: 相对两种机加面，毛坯刀路不随轴距改变，轴距差落在可更换的防转板上。
    figure:
      view: 侧视，标出车辆纵向、下内点、弹簧下座和衬套轴线。两个轴距状态叠在同一张侧视上。
      parts: 副车架毛坯、车身安装孔、移位板、下控制臂内点、弹簧下座、衬套。
      invariant: 毛坯、车身安装孔、下内点相对弹簧下座的向量、衬套轴线相对控制臂的角度。
      variant_delta: 移位板沿车辆纵向的位置随轴距变化。
      difference_vs_baseline: 基线用两套毛坯，或只拉开车身孔。本案毛坯和车身孔不变，用移位板把内点和弹簧座作为一组搬走。
    effects:
      - feature_ids: [F1, F2, F3]
        feature_label: 成组纵向移位
        rank: 必要
        mechanism: 移位板把下内点和弹簧下座固定成一组，只改变这一组相对毛坯的纵向位置。
        effect: 轴距改变后，下内点相对弹簧座的位置仍与短轴距相同。
        setup: 同一副车架毛坯、同一组车身孔上分别装配两种移位板，测量内点相对弹簧座的向量。
        criterion: 两种轴距的该向量方向一致。毛坯号和车身安装孔坐标不变。具体偏差待测。
        status: 待测
      - feature_ids: [F4]
        feature_label: 加工面保证角度
        rank: 必要
        mechanism: 衬套轴线的角度做在移位板的加工面上，装配时没有垫片把角度叠出来。
        effect: 两种轴距的衬套工作角由零件加工保证，不随垫片厚度变化。
        setup: 不使用角度垫片，装配两种移位板，测量衬套轴线相对控制臂的角度。
        criterion: 两种轴距的该角度一致。角度差的允许值待测，不写度数。
        status: 待测
      - feature_ids: [R1]
        feature_label: 防错
        rank: 优选
        mechanism: 防错结构使一种轴距的移位板无法装到另一种轴距的定位面上。
        effect: 左右或前后不会因为装反出现两套轴距几何。
        setup: 用短轴距板去配长轴距的定位面，检查能否装配。
        criterion: 错误组合装不进去。正确组合的纵向位置与图说一致。
        status: 待测
    risks:
      - 纵向移位会改变半轴伸缩量，图说要把花键余量列为检查项，正式项目用计算值替换。
      - 移位板如果比原凸台软，内点会多出一层柔度，刚度要单独核对。
      - 两种板装反会把轴距几何左右做反，防错要做在定位面上。
    patent:
      retrieval_risk: 中
      retrieval_risk_reason: 可更换支架很常见。必须同时写明同一毛坯、同一组车身孔，以及内点和弹簧座被一起沿纵向搬走。
      independent_claim: >
        一种用于至少两种轴距的后悬架移位板，所述移位板安装于同一副车架毛坯，该毛坯与车身的安装孔为同一组，其特征在于，
        所述移位板同时定位下控制臂内点与弹簧下座；两种轴距所用移位板之间，下控制臂内点与弹簧下座的相对位置保持不变，
        两种移位板的差别是沿车辆纵向的位置；衬套轴线相对控制臂的角度由所述移位板上的加工面确定。
      dependents:
        - 两种轴距的移位位置为同一毛坯上不同的机加面。
        - 移位板为带防转面的独立零件，毛坯刀路不随轴距改变。
        - 移位板设有防错结构，使两种轴距的板不能互换装配。
      compare_with:
        - 两种轴距各做一套副车架毛坯
        - 只把车身安装孔沿纵向拉开、悬架硬点相对关系随之改变的做法
        - 用一叠调整垫片同时垫出纵向位置和衬套角度
      must_not_claim:
        - 不保护提高平台共用率这一效果本身
        - 不把轴距的目标毫米数写成必要特征
        - 不把缓冲块后的冲击路径写成已被本案解决
      standalone: 不需要第二接触垫块。只要移位板把内点和弹簧座一起沿纵向搬走，本案就成立。

family:
  principle: 两案分别对应冲击路径和轴距几何。可以同时装在一辆车上，但交底和权利要求必须拆开。
  rules:
    - 删掉另一案的特征后，本案仍然能单独讲清问题和效果。
    - 不写把两案串在一起的系统独立权利要求。
    - 提案一的申请附图不画轴距移位板。提案二的申请附图不画第二接触垫块。
  drawing_note: 两案的组合安装图只留在内部评审稿，不进入先申请的附图。是否保留由专利工程师在检索后决定。

roadmap:
  - phase: 特征确认
    work: 核对两案的必要特征和单独立案边界。用户若给出实车基线，先替换本案里的假定基线。
    gate: 必要特征如果还是性能形容词，就停在这一步。
  - phase: 检索
    work: 专利工程师按两案分别检索，不并成一个主题。
    gate: 被公开结构覆盖的特征从必要特征里删除。
  - phase: 交底
    work: 检索后仍保留的方案再写正式交底书。申请日前，必要特征不放进外发图纸。
    gate: 检索没有结论之前，垫块和移位板不放进供应商询价包。

decisions:
  - question: 是否同意两案都送检索，并且分开撰写？
    why: 一个管缓冲块之后的冲击路径，一个管轴距硬点。并成一条系统权利要求，任一部分被公开都会把另一部分拖进去。
  - question: 实车基线如果不是后五连杆，是否先停掉这两案？
    why: 本案的接触副和移位板都按副车架上的内点来写。基线若是扭力梁或整体桥，必要特征要重写。

dropped:
  - idea: 用摄像头预瞄在行程末端限制冲击
    reason: 没有新的接触结构，缓冲块压实后的力仍然会撬进内点衬套。
  - idea: 只把缓冲块加厚
    reason: 必要特征会退化成一个行程数字，也不能规定力进入纵梁而不是内点衬套。
  - idea: 用一叠垫片既拉开轴距又调出衬套角度
    reason: 角度会随垫片公差累加，和加工面保证角度的特征相反。

confidentiality:
  legal: 这两页是内部提案介绍，不是检索报告，也不是申请文件。未写已有数据的地方都没有试验。值不值得申请，要等检索之后再判断。
  supplier: 申请日前，第二接触的闭合顺序、移位板的纵向关系和加工面不要放进外发图纸或询价包。
