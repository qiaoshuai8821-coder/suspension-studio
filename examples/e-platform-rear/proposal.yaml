version: 1

meta:
  platform_name: E 平台
  module: 后悬架模块
  short_name: E 平台后悬架
  axle: 后悬架
  purpose: 把能写成权利要求的结构关系讲清楚。没有试验的地方就写待测。
  date: "2026-11-05"
  audience: 底盘技术评审与专利工程师
  classification: 内部评审
  example: true
  author: 底盘悬架
  scope_line: 后悬架 · 两种车高 · 两种电机包络
  file_stem: E平台后悬架创新提案

titles:
  platform: 毛坯和车身安装点共用，硬点不全部共用
  contradictions: 三个矛盾都不能靠刚度取中间值
  overview: 三案各解一个矛盾，检索风险不同
  family: 可以共安装块，不能共一条权利要求
  roadmap: 检索没有结论之前，斜孔不进样件
  decisions: 先定检索顺序，不定平台是否创新
  appendix: 这些方向本次不写进交底

notes:
  platform: 尺寸故意不写。被问到毫米时，回答是正式项目用计算值替换，本册没有测量。
  overview: 按检索风险分开讲。提案三不是和提案一同一等级的撰写对象。
  family: 组合图不要事后放进第一份申请的附图。
  decisions: 会上只请拍板这四件事，不临时加百分比。

platform:
  scope: 纯电乘用车的后悬架模块，覆盖两种车高和两种后驱电机包络。前悬、转向和制动接口不在本次范围内。
  baseline: 后五连杆，铸铝副车架，螺旋弹簧，被动减振器。电机装在副车架上，有同轴和偏置两种包络。基线把电机安装区和控制臂内点做成同一刚性凸台；车高差靠弹簧和缓冲块消化；衬套轴线垂直于控制臂的水平摆动平面。
  assumptions:
    - 示例平台，不是某一主机厂的真实项目。
    - 只区分两种车高和两种电机包络，不写毫米和功率。
    - 基线按后五连杆和铸铝副车架来写。若是扭力梁或整体桥，三案都要重写。
  frozen:
    - 副车架与车身的安装点本次保持不动。
    - 转向节与制动卡钳的接口不动。
    - 车身安装点本次不动，冲击要进入副车架。
  interfaces:
    - 副车架与车身安装点
    - 半轴与球笼
    - 稳定杆
    - 制动与轮速传感器线束
  variants:
    - name: 低车高
      difference: 较低离地间隙，同轴电机包络
    - name: 高车高
      difference: 更高离地间隙，偏置三合一电机包络

contradictions:
  - id: C1
    left: 驱动反力需要高刚度路径
    right: 内点衬套径向需要偏软
    clash: 同一个刚性凸台
    baseline_failure: 基线把电机安装和控制臂内点做成同一刚性凸台。凸台做硬，冲击从内点进副车架；凸台做软，反力又推动内点硬点。
  - id: C2
    left: 高车高需要更大离地间隙
    right: 对中位置的侧倾中心和抗蹲不想跟着漂
    clash: 只抬弹簧座
    baseline_failure: 基线用弹簧和缓冲块消化车高，硬点完全共用。对中位置换到运动学曲线的另一点，侧倾中心和侧视摆臂角一起变。另做副车架能改硬点，但毛坯不能共用。
  - id: C3
    left: 路面冲击希望内点径向柔软
    right: 驱动纵向力下的退让要变成前束增加
    clash: 一个径向刚度
    baseline_failure: 基线衬套轴线垂直于控制臂的水平摆动平面，径向刚度几乎是唯一主参数。做软则驱动时退让方向不受控，做硬则冲击差。

proposals:
  - id: P1
    name: 反力与衬套分路支架
    claim_type: 装置
    one_liner: 合力线避开衬套，冲击另有止挡
    problem_title: 电机反力不要再带动内点硬点
    solution_title: 反力走外圈，衬套留在偏置的颈上
    embodiment_title: 颈可以铸在一起，也可以换成簧片
    effect_title: 只在反力矩单独作用时判断本案
    patent_title: 要保护的是偏置、柔性颈和止挡
    contradiction_ids: [C1]
    only_this: 只解开电机反力对内点硬点的带动。不处理车轮纵向力引起的柔度转向，也不处理车高几何。
    conditions:
      - 驱动加速时，电机反力矩进入副车架
      - 路面纵向冲击从车轮传到内点
      - 两种车高都要装同一支架本体
    baseline_failure: 基线的刚性凸台只能取一个刚度。取硬则冲击通过内点区域进副车架，取软则驱动反力推动内点硬点，前束随扭矩漂移。
    card:
      problem: 反力和衬套绑在同一个刚性凸台上。
      feature: 合力线避开衬套，颈不传反力，冲击有止挡。
      criterion: 车轮纵向力为零，只加反力矩，看内点和前束。
    essential_features:
      - id: F1
        text: 反力安装部与衬套安装部分开，不是同一个刚性凸台。
      - id: F2
        text: 衬套轴线相对反力合力线偏置，合力线不穿过衬套中心。
      - id: F3
        text: 两个安装部之间设柔性颈，颈不作为驱动反力的主路径。
      - id: F4
        text: 冲击超过工作行程时止挡闭合，冲击进入纵梁，颈不单独承受。
    preferred_features:
      - id: R1
        text: 同一支架本体加垫片，两种车高一起平移两个安装部，偏置方向不变。
    diagram:
      caption: 传力示意，不是几何图
      note: 偏置指反力合力线不穿过衬套中心。大冲击时止挡闭合，颈不单独承力。
      paths:
        - name: 驱动反力
          tone: stiff
          steps: [电机安装部, 支架外圈, 副车架纵梁]
        - name: 衬套与冲击
          tone: soft
          steps: [下控制臂, 内点衬套, 柔性颈, 冲击止挡]
    embodiments:
      - name: 颈与支架一体
        structure: 颈和止挡都在铸件上。止挡是支架与纵梁的一对配合面，间隙大于工作变形、小于碰撞行程。
        difference: 相对簧片方案，颈不可拆，间隙由加工面一次保证。
      - name: 可更换簧片
        structure: 颈是螺栓连接的簧片，铸造本体在两种车高上共用。止挡仍在铸件上，不放在簧片上。
        difference: 相对一体方案，颈可更换，冲击仍不由簧片单独承受。
    figure:
      view: 后视看副车架局部，辅以通过衬套中心的水平剖视，标出合力作用线和衬套中心。
      parts: 副车架纵梁、支架外圈、反力安装部、内点衬套、柔性颈、冲击止挡、垫片组、下控制臂。
      invariant: 支架锻造体、衬套零件，以及两组安装孔的相对设计位置。
      variant_delta: 垫片厚度随车高变化，反力安装部与内点一起平移，偏置方向不变。
      difference_vs_baseline: 基线的内点和电机安装在同一刚性凸台，合力线穿过衬套附近。本案把合力线移出衬套中心，并在中间设置颈和止挡。
    effects:
      - feature_ids: [F1, F2, F3]
        feature_label: 分开、偏置与柔性颈
        rank: 必要
        mechanism: 反力从支架外圈进入纵梁，合力线不穿过衬套，颈不把反力矩转角强加给衬套壳体。
        effect: 反力矩引起的内点位移下降，由此产生的前束变化下降。
        setup: 车轮纵向力为零，只对驱动单元加反力矩，测量内点位移和前束角。
        criterion: 衬套径向静刚度低于基线时，该前束角仍不超过基线。限值等有基线后再填。
        status: 待测
      - feature_ids: [F4]
        feature_label: 冲击止挡
        rank: 必要
        mechanism: 内点超过工作行程后，止挡配合面接触，冲击从配合面进入纵梁。
        effect: 柔性颈不再单独承受这份冲击。
        setup: 沿车轮纵向把内点推过工作行程，测量颈根部应变。
        criterion: 止挡闭合后，颈根部应变不再随纵向推力线性上升。
        status: 待测
      - feature_ids: [R1]
        feature_label: 垫片保持偏置
        rank: 优选
        mechanism: 垫片同时平移反力安装部和衬套安装部。
        effect: 两种车高共用支架本体，偏置方向不变。
        setup: 只更换垫片组，装配两种车高，测量偏置方向。
        criterion: 支架本体零件号不变，偏置方向不变。
        status: 待测
    risks:
      - 颈根部要有可以目视的检查面，裂纹不能靠口头提醒。
      - 垫片公差会进前束和外倾，实施例要规定分组，不能无限加垫。
      - 止挡闭合会有一次冲击声，这项噪声要单列，不能只看衬套柔度。
    patent:
      retrieval_risk: 中
      retrieval_risk_reason: 只写成两个支架几乎没有区分度。独立权利要求要同时有偏置、柔性颈和冲击止挡。
      independent_claim: >
        一种后悬架内点支架，用于传递驱动单元的反力并安装控制臂内点衬套，其特征在于，所述支架具有彼此分开的反力安装部与衬套安装部；
        所述衬套安装部上的衬套轴线相对反力合力作用线偏置，使该合力作用线不穿过衬套中心；
        所述反力安装部与所述衬套安装部之间设有柔性颈，所述柔性颈不构成驱动反力的主传递路径；
        所述支架还设有冲击止挡，在内点位移超过工作行程时所述冲击止挡闭合，冲击载荷经所述支架进入副车架，而不由所述柔性颈单独承受。
      dependents:
        - 柔性颈与支架本体一体成型，冲击止挡为支架与纵梁上的一对配合面。
        - 柔性颈为可更换簧片，用紧固件连在两个安装部之间，冲击止挡仍设于支架本体。
        - 两种车高共用同一支架本体，垫片同时平移两个安装部，偏置方向保持不变。
      compare_with:
        - 电机支架与控制臂内点铸在同一刚性区域的常见五连杆
        - 只更换衬套径向刚度，安装点仍然共刚性
        - 用扭矩信号做电子修正，掩盖加速时的前束漂移
      must_not_claim:
        - 不保护提高加速稳定性这一效果本身
        - 不保护衬套配方或一个径向刚度数值
        - 不把车轮纵向力引起的柔度转向写成已被本支架解决
      standalone: 只有一种车高、衬套轴线也不倾斜时，分路、偏置和止挡仍然成立。

  - id: P2
    name: 车高安装块的两套位移
    claim_type: 装置
    one_liner: 弹簧座与内点的位移不平行
    problem_title: 只抬弹簧座，对中几何会一起漂
    solution_title: 弹簧座和内点走两条不平行位移
    embodiment_title: 机加面或防转斜垫片，二选一写清
    effect_title: 同一组孔上测量两种对中几何
    patent_title: 只写可更换支架，这个案不成立
    contradiction_ids: [C2]
    only_this: 只处理两种车高之间离地间隙和对中几何的关系。不处理反力路径，也不处理衬套轴线。
    conditions:
      - 两种车高共用副车架毛坯和车身安装点
      - 高车高需要更大的离地间隙
      - 对中位置要设定侧倾中心和抗蹲
    baseline_failure: 只加高弹簧座时，质心上升，连杆转到新的对中角度，侧倾中心高度和侧视摆臂角一起离开轿车的几何关系。两套副车架能改，但铸造毛坯不能共用。
    card:
      problem: 只抬弹簧座时，对中几何一起漂。
      feature: 同一组孔上，弹簧座位移和内点位移不平行。
      criterion: 两种安装块分别测离地间隙、侧倾中心和抗蹲。
    essential_features:
      - id: F1
        text: 两种车高使用副车架上的同一组安装孔，毛坯不更换。
      - id: F2
        text: 安装块同时定位弹簧下座和下控制臂内点。
      - id: F3
        text: 弹簧座位移与下内点位移不平行。前者设定离地间隙；后者含后视图中的倾角分量和车辆纵向分量，分别设定侧倾中心高度和侧视摆臂角。
      - id: F4
        text: 上控制臂内点以及副车架与车身的安装点不随安装块更换。
    preferred_features:
      - id: R1
        text: 安装块设防错结构，使两种车高的安装块不能互换。
    diagram:
      caption: 位移示意，不是几何图
      note: 两条位移不平行。后视图中的倾角分量管侧倾中心，车辆纵向分量管侧视摆臂角。
      paths:
        - name: 弹簧座位移
          tone: stiff
          steps: [同一组孔, 弹簧下座, 离地间隙]
        - name: 内点位移
          tone: soft
          steps: [下控制臂内点, 后视图倾角, 车辆纵向]
    embodiments:
      - name: 两种机加面
        structure: 同一毛坯、同一组安装孔。两种车高的弹簧座面和下内点孔不同，两处位移不平行。
        difference: 相对斜垫片方案，位移差由两套机加面完成，不靠垫片叠出。
      - name: 防转斜垫片
        structure: 安装块本体只有一种。防转斜垫片同时产生弹簧座与下内点之间的垂向差和纵向差。
        difference: 相对两种机加面，本体只有一件，位移差来自防转斜垫片。
    figure:
      view: 侧视表达车辆纵向和侧视摆臂，后视表达下臂倾角和侧倾中心。两个视图都要画。
      parts: 副车架安装孔、安装块、弹簧下座、下控制臂内点、上控制臂内点、车身安装点。
      invariant: 副车架毛坯、副车架与车身的安装孔、上控制臂内点。
      variant_delta: 更换安装块后，弹簧下座和下内点的位移不平行。
      difference_vs_baseline: 基线只更换弹簧座，下内点不动。本案在同一组孔上同时更换弹簧座和下内点的定位，且两套位移不平行。
    effects:
      - feature_ids: [F1, F2, F3]
        feature_label: 同孔与不平行位移
        rank: 必要
        mechanism: 弹簧座位移设定离地间隙。内点在后视图中的倾角分量设定侧倾中心，纵向分量设定侧视摆臂角。
        effect: 离地间隙改变后，对中位置的侧倾中心高度和侧视摆臂角仍可按目标设定。
        setup: 同一组孔上分别安装两种安装块，在各自对中载荷下测量离地间隙、侧倾中心高度和抗蹲。
        criterion: 上内点坐标不变。两种车高相对各自目标的偏差，都小于只换弹簧座的基线。目标值待填。
        status: 待测
      - feature_ids: [F4]
        feature_label: 上点与车身点不动
        rank: 必要
        mechanism: 校正只来自下内点，上内点和车身安装点不随机型更换。
        effect: 副车架毛坯和车身安装点保持一种。
        setup: 对照两种状态下的毛坯号、车身安装孔坐标和上内点坐标。
        criterion: 毛坯号、车身安装孔坐标和上内点坐标都不随机型改变。
        status: 待测
      - feature_ids: [R1]
        feature_label: 防错
        rank: 优选
        mechanism: 防错结构使一种车高的安装块无法装到另一种车高上。
        effect: 左右几何不会因为装反而不一致。
        setup: 用错误的安装块去配另一种车高，检查能否装配。
        criterion: 错误组合装不进去。正确组合的定位与图说一致。
        status: 待测
    risks:
      - 内点的纵向移动会改变半轴伸缩量，图说要把花键余量列为检查项。
      - 安装块若比原凸台软，会多出一层柔度，这层刚度要单独核对。
      - 两种安装块装反会造成左右不一致，防错要写进实施方式。
    patent:
      retrieval_risk: 中
      retrieval_risk_reason: 可更换支架很常见。必须写清同一组孔，以及两套不平行、分工不同的位移。
      independent_claim: >
        一种后悬架安装块，用于至少两种车高，并固定于副车架的同一组安装孔，其特征在于，所述安装块同时定位弹簧下座与下控制臂内点；
        两种车高所用安装块之间，弹簧下座的位移矢量与下控制臂内点的位移矢量不平行；
        所述下控制臂内点的位移同时包含改变后视图中控制臂倾斜的分量，以及沿车辆纵向的分量，前者用于设定对中位置的侧倾中心高度，后者用于设定侧视摆臂角；
        上控制臂内点以及副车架与车身的安装点不随所述安装块更换而改变。
      dependents:
        - 两种车高的安装块为同一毛坯上不同的机加定位面。
        - 位移差由设有防转结构的斜垫片产生，安装块本体保持一种。
        - 安装块设有防错结构，使两种车高的安装块不能互换装配。
      compare_with:
        - 只更换弹簧和缓冲块来增加离地间隙
        - 两种车高各做一套副车架
        - 用空气弹簧只做静态找平，硬点保持不变
      must_not_claim:
        - 不保护可更换支架这一通用做法本身
        - 不把侧倾中心或抗蹲的目标数值写成必要特征
        - 不保护用空气弹簧做静态找平
      standalone: 不需要柔性颈，也不需要斜孔。两种安装块的位移不平行，本案就成立。

  - id: P3
    name: 斜孔衬套的驱动前束
    claim_type: 装置
    one_liner: 斜孔把驱动纵向力送进轴向
    problem_title: 一个径向刚度决定不了前束方向
    solution_title: 斜孔把驱动纵向力送进衬套轴向
    embodiment_title: 斜角做在零件上，不靠装配去找
    effect_title: 驱动纵向力和径向冲击分开测
    patent_title: 斜置衬套先检索，检索前不写交底
    contradiction_ids: [C3]
    only_this: 只处理驱动纵向力下的前束方向。不处理电机反力带动硬点，也不处理车高引起的侧倾中心变化。
    conditions:
      - 驱动时车轮承受纵向力
      - 路面冲击以衬套径向为主
      - 两种车高希望共用衬套零件号
    baseline_failure: 轴线垂直于摆动平面时，径向刚度同时决定隔振和力转向。空穴衬套能做出分段刚度，但车高一变，工作点离开设计区间，就要第二个衬套零件号。
    card:
      problem: 径向刚度决定不了驱动时的前束方向。
      feature: 斜孔把一部分驱动纵向力送进衬套轴向。
      criterion: 驱动纵向力和径向冲击分开测，看前束方向。
    essential_features:
      - id: F1
        text: 衬套轴线相对控制臂水平摆动平面倾斜一个锐角，角度由斜孔保证，不在装配时找角度。
      - id: F2
        text: 衬套轴向刚度高于径向。驱动纵向力的轴向分力使内点沿斜轴窜动。
      - id: F3
        text: 该窜动经控制臂转成前束增加。前束增加指车轮前端向车辆中心线靠拢，方向在俯视图里对前进方向标出。
      - id: F4
        text: 以径向为主的路面冲击走径向低刚度，不靠轴向高刚度隔振。
    preferred_features:
      - id: R1
        text: 车高变化只更换斜孔零件，衬套零件号保持不变。
    diagram:
      caption: 力的分量示意，不是几何图
      note: 前束增加指车轮前端向车辆中心线靠拢。倾斜方向以俯视图的前进方向为准。
      paths:
        - name: 驱动纵向力
          tone: stiff
          steps: [车轮纵向力, 斜孔轴向分量, 前束增加]
        - name: 路面冲击
          tone: soft
          steps: [径向冲击, 衬套径向, 低刚度变形]
    embodiments:
      - name: 机加斜孔
        structure: 斜孔在支架上，衬套轴向刚度高于径向。轴线角度完全由斜孔决定，装配时不能转动找角度。
        difference: 相对可更换斜套，角度不可调，由机加斜孔一次保证。
      - name: 可更换斜套
        structure: 支架本体没有斜孔。斜套与支架有防转面，衬套压在斜套里，角度由斜套决定。
        difference: 相对机加斜孔，角度件可以拆下，便于申请附图里先不公开斜孔。
    figure:
      view: 俯视，标出车辆前进方向。驱动时车轮前端向车辆中心线靠拢，并标出衬套轴线的倾斜方向。
      parts: 下控制臂、内点衬套、斜孔或斜套、安装块、上控制臂内点。
      invariant: 衬套零件号。上控制臂内点轴线垂直于其摆动平面。
      variant_delta: 斜角若随机型变化，只更换斜孔零件，不更换衬套。
      difference_vs_baseline: 基线衬套轴线垂直于水平摆动平面，径向刚度决定退让。本案由斜孔把一部分驱动纵向力转到轴向，并规定前束增加的方向。
    effects:
      - feature_ids: [F1, F2, F3]
        feature_label: 斜孔与轴向窜动
        rank: 必要
        mechanism: 斜孔把一部分驱动纵向力转到衬套轴向，窜动沿倾斜方向推动控制臂。
        effect: 驱动纵向力下前束增加，方向由斜孔保证，不由径向刚度高低决定。
        setup: 对车轮施加驱动方向的纵向力，测量前束角和衬套轴向窜动量。
        criterion: 径向静刚度低于基线时，驱动方向仍出现前束增加。增加量待填，不写度数。
        status: 待测
      - feature_ids: [F4]
        feature_label: 冲击走径向
        rank: 必要
        mechanism: 冲击方向接近径向，变形发生在低刚度的径向。
        effect: 隔振不依赖轴向的高刚度。
        setup: 以径向为主施加载荷，测量径向变形和轴向窜动。
        criterion: 同一载荷水平下，径向变形大于轴向窜动。不写刚度数值。
        status: 待测
      - feature_ids: [R1]
        feature_label: 衬套零件号
        rank: 优选
        mechanism: 斜角做在安装块的孔上，衬套本身不带车型角度。
        effect: 两种车高共用一个衬套零件号。
        setup: 核对两种安装块的斜孔和衬套零件号。
        criterion: 衬套零件号只有一个，斜孔可以随机型不同。
        status: 待测
    risks:
      - 斜孔方向装反，驱动时会变成前束减少，防错要做在零件上。
      - 轴向刚度若把冲击也接住，隔振就不成立，高低关系要写进衬套图。
      - 本案不管电机反力带动硬点。硬点本身在转时，要和分路支架分开验证。
    notes:
      patent: 这一页的结论是先检索、先不写交底。不要讲成已经可以撰写。
    patent:
      retrieval_risk: 高
      retrieval_risk_reason: 斜置衬套是成熟结构。三条特征写全仍可能被覆盖，所以检索前不写正式交底。
      independent_claim: >
        一种后悬架控制臂内点的衬套安装结构，其特征在于，内点衬套的轴线相对控制臂在水平面内的摆动平面倾斜一个锐角，该锐角由支架上的斜孔确定；
        所述衬套沿自身轴向的刚度高于其径向刚度；
        驱动工况下车轮纵向力在所述轴向上的分力使内点沿斜轴窜动，该窜动经控制臂转化为车轮前束增加；
        以径向为主的路面冲击主要使所述衬套沿径向变形。
      dependents:
        - 锐角随机型改变时，更换带斜孔的零件，内点衬套的零件号保持不变。
        - 仅下控制臂内点采用斜孔，上控制臂内点的衬套轴线垂直于其摆动平面。
      compare_with:
        - 轴线垂直于摆动平面的常规内点衬套
        - 只做空穴、不改变轴线方向的分段刚度衬套
        - 装配时现场把衬套压成某个角度的做法
      must_not_claim:
        - 不保护把衬套斜着装这一通用做法本身
        - 不保护某条空穴刚度曲线
        - 不把电机反力带动硬点写成已被本结构解决
      standalone: 不需要分开反力路径。斜孔、轴向窜动和前束方向这组关系在，本案就成立。

family:
  principle: 三案可以做在同一只安装块上，但交底必须拆开。组合是内部实施，不是一件悬架平台系统发明。
  rules:
    - 删掉另外两案的特征后，本案仍然能单独讲清问题和效果。
    - 不写把三案串在一起的系统独立权利要求。
    - 提案一的申请附图不画斜孔，提案三的申请附图不画柔性颈。组合图只留在内部，并标明不进入先申请的附图。
    - 提案三在检索结论出来之前不写正式交底，也不把斜孔放进样件。
  drawing_note: 先申请的附图按少公开来画。垫片策略、斜孔方向和组合图默认不进说明书附图，检索后由专利工程师决定是否保留。

roadmap:
  - phase: 特征确认
    work: 核对三案的必要特征、图说和单独立案边界。提案三只列为检索题，不写交底正文。
    gate: 必要特征如果还是性能形容词，就停在这一步。
  - phase: 检索
    work: 专利工程师按提案一、提案二检索。提案三单独检索，不和前两案并成一个主题。
    gate: 被公开结构覆盖的特征从必要特征里删除，不靠措辞藏过去。
  - phase: 样件与运动学
    work: 只做检索后仍保留的特征。试验大纲只保留效果页上写明的试验和判据。
    gate: 斜孔不进这一阶段的样件，除非提案三的检索结论是继续撰写。
  - phase: 交底
    work: 对保留下来的方案写正式技术交底书。内部组合图不自动变成说明书附图。
    gate: 申请日前，必要特征不放进外发供应商的询价包和外部评审材料。

decisions:
  - question: 是否同意把提案一作为第一份检索案？
    why: 要保护的是偏置、柔性颈和冲击止挡，不是支架分成两块。边界不同意，就先改特征再检索。
  - question: 是否同意提案二与提案一分案撰写？
    why: 一个管反力路径，一个管车高几何。并成一条系统权利要求，任一部分被公开都会把另一部分拖进去。
  - question: 是否同意提案三在检索前不写交底、样件也不做斜孔？
    why: 斜置衬套是拥挤区。先把斜孔公开，对后续申请没有好处。
  - question: 垫片和斜垫片的防错，是否写进实施方式？
    why: 不写进去，提案一的垫片优选特征和提案二的斜垫片实施方式就删掉，不能只留在装配口头要求里。

dropped:
  - idea: 用摄像头预瞄调节阻尼
    reason: 没有新的结构、安装关系或失效后的机械后备，属于已经很拥挤的控制主题。
  - idea: 每种车高各做一套衬套刚度
    reason: 这是零件选型。必要特征会退化成一个刚度数字，也和平台共用零件相反。
  - idea: 用空气弹簧把高车高车找平
    reason: 这是已知手段，只改变静态高度，不设定侧倾中心和侧视摆臂角。
  - idea: 把三案写成一个智能悬架平台
    reason: 没有单一的技术问题，也没有一组拿掉就失效的必要特征，无法据此检索或撰写。

confidentiality:
  legal: 本册是内部创新提案，不是检索报告，也不是申请文件。未写已有数据的地方都没有试验。新颖性和是否值得申请，要等检索之后再判断。
  supplier: 申请日前，必要特征、斜孔方向、柔性颈和垫片策略不要放进外发图纸、询价包或供应商交流。组合图只在内部传阅。
